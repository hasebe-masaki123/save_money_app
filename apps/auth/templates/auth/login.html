{% extends "base.html" %}
{% block content %}
<h2>ログイン</h2>
<form method="POST">
  <input type="email" name="email" placeholder="メールアドレス" required><br>
  <input type="password" name="password" placeholder="パスワード" required><br>
  <button type="submit">ログイン</button>
</form>
<p><a href="{{ url_for('auth.signup') }}">新規登録はこちら</a></p>
{% endblock %}

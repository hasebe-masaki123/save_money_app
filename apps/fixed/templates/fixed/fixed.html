{% extends "base.html" %}
{% block content %}

<h2 class="mt-3 mb-3">固定費一覧</h2>

<!-- 固定費一覧 -->
<div class="list-group mb-4">
    {% for f in fixed_list %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <strong>{{ f.name }}</strong><br>
            <small>{{ f.billing_day }}日 / {{ f.default_amount }}円</small>
        </div>
        <a href="{{ url_for('fixed.fixed_edit', fixed_id=f.fixed_id) }}" class="btn btn-sm btn-outline-primary">編集</a>
    </div>
    {% else %}
    <p class="text-muted">登録された固定費はありません。</p>
    {% endfor %}
</div>

<!-- 固定費追加ボタン -->
<div class="d-grid gap-2 mb-4">
    <button type="button" class="btn btn-primary" 
        onclick="location.href='{{ url_for('fixed.fixed_add') }}'">
        新しい固定費を追加
    </button>
</div>

<!-- 戻るボタン -->
<div class="button-row">
    <button type="button" class="btn btn-secondary"
        onclick="location.href='{{ url_for('top.input_menu_page') }}'">戻る</button>
</div>

{% endblock %}

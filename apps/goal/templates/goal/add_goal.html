<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>固定費新規追加</title>
    <style>
        body {
            font-family: "Noto Sans JP", sans-serif;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1,
        h2 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        label {
            display: flex;
            flex-direction: column;
            font-size: 16px;
        }

        input {
            padding: 8px;
            font-size: 16px;
            margin-top: 5px;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel {
            background-color: #eee;
        }

        .add {
            background-color: #f8f8f8;
        }
    </style>
</head>

<body>
    <h1>新規目標設定</h1>


    <form method="post" action="/add_fixed_cost">
        <label>
            目標金額：
            <input type="text" name="name" placeholder="￥" required>
        </label>

        <label>
            目標期日：
            <input type="date" name="amount" placeholder="" required>
        </label>

        <label>
            タイトル：
            <input type="text" name="text" placeholder="" required>
        </label>

        <label>
            メモ：
            <textarea name="memo" rows="4" placeholder="" required></textarea>
        </label>


        <div class="button-row">
            <button type="button" class="cancel" onclick="location.href='/fixed_costs'">キャンセル</button>
            <button type="submit" class="add">追加</button>
        </div>
    </form>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>目標設定</title>
    <style>
        body {
            font-family: "Noto Sans JP", sans-serif;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        label {
            display: flex;
            flex-direction: column;
            font-size: 16px;
        }

        input,
        select {
            padding: 8px;
            font-size: 16px;
            margin-top: 5px;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel {
            background-color: #eee;
        }

        .add {
            background-color: #f8f8f8;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .small-input {
            width: 120px;
        }
    </style>
</head>

<body>

    <h2>目標設定</h2>

    <form id="goalForm" method="post" action="/add_goal">
        <!-- 現在の目標 -->
        <label>
            現在の目標：
            <input type="text" name="current_goal" placeholder="">
        </label>

        <!-- 目標額 -->
        <label>
            目標額：
            <div class="row">
                <input type="number" class="small-input" name="target_amount" placeholder="￥" required>
                <span>円</span>
            </div>
            <span class="error">0以上の整数を入力してください</span>
        </label>

        <!-- 達成額 -->
        <label>
            達成額：
            <div class="row">
                <input type="number" class="small-input" name="achieved_amount" placeholder="￥" required>
                <span>円</span>
            </div>
            <span class="error">0以上の整数を入力してください</span>
        </label>

        <!-- 期限 -->
        <label>
            期限：
            <div class="row">
                <select name="month" id="monthSelect" required>
                    <option value="">月</option>
                </select>
                <select name="day" id="daySelect" required>
                    <option value="">日</option>
                </select>
            </div>
        </label>

        <!-- ボタン -->
        <div class="button-row">
            <button type="button" class="cancel" onclick="location.href='/goals'">キャンセル</button>
            <button type="submit" class="add">新規登録</button>
        </div>
    </form>

    <script>
        // 月を生成
        const monthSelect = document.getElementById('monthSelect');
        for (let i = 1; i <= 12; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i + '月';
            monthSelect.appendChild(opt);
        }

        // 日を生成
        const daySelect = document.getElementById('daySelect');
        for (let d = 1; d <= 31; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d + '日';
            daySelect.appendChild(opt);
        }

        // 数値入力のチェック
        const form = document.getElementById('goalForm');
        const numberInputs = form.querySelectorAll('input[type="number"]');

        numberInputs.forEach(input => {
            const errorSpan = input.parentElement.nextElementSibling;
            input.addEventListener('input', () => {
                if (Number(input.value) < 0) {
                    errorSpan.style.display = 'block';
                    input.style.borderColor = 'red';
                } else {
                    errorSpan.style.display = 'none';
                    input.style.borderColor = '';
                }
            });
        });

        form.addEventListener('submit', e => {
            let hasError = false;
            numberInputs.forEach(input => {
                const errorSpan = input.parentElement.nextElementSibling;
                if (Number(input.value) < 0 || input.value === '') {
                    hasError = true;
                    errorSpan.style.display = 'block';
                    input.style.borderColor = 'red';
                    input.focus();
                } else {
                    errorSpan.style.display = 'none';
                    input.style.borderColor = '';
                }
            });
            if (hasError) e.preventDefault();
        });
    </script>

</body>

</html>

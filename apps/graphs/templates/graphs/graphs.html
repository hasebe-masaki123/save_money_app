{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('graphs.static', filename='css/graphs.css')}}">
{% endblock %}
{% block content %}

<h2>グラフ</h2>
<div class="container px-0 mt-3 mb-3">
    <div class="row g-0 text-center">

        <div class="col-4">
            <button class="mode-btn active w-100 py-2" data-mode="expense">
                支出
            </button>
        </div>

        <div class="col-4">
            <button class="mode-btn w-100 py-2" data-mode="income">
                収入
            </button>
        </div>

        <div class="col-4">
            <button class="mode-btn w-100 py-2" data-mode="saving">
                貯金
            </button>
        </div>

    </div>
</div>

<!-- 月選択部分 -->
<div class="d-flex align-items-center mb-2 w-100">
    <button id="prevMonthBtn" class="btn btn-outline-secondary me-2 flex-shrink-0">&lt;</button>
    <input type="month" id="monthSelect" value="{{ current_month | e }}" class="form-control flex-grow-1">
    <button id="nextMonthBtn" class="btn btn-outline-secondary ms-2 flex-shrink-0">&gt;</button>
</div>

<script>
    // 月変更関数
function changeMonth(offset) {
    const monthInput = document.getElementById("monthSelect");
    let [year, month] = monthInput.value.split('-').map(Number);
    month += offset;
    if (month < 1) {
        year--;
        month = 12;
    } else if (month > 12) {
        year++;
        month = 1;
    }
    monthInput.value = `${year}-${String(month).padStart(2, '0')}`;
    reloadGraph();
}

document.getElementById("prevMonthBtn").addEventListener("click", () => changeMonth(-1));
document.getElementById("nextMonthBtn").addEventListener("click", () => changeMonth(1));
</script>

<canvas id="weeklyGraph" width="350" height="300"></canvas>

<h3>月合計</h3>
<p id="totalAmount">￥{{ total_data }}</p>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// グラフインスタンス
let chartInstance = null;
// 現在のモード（初期値は支出）
let currentMode = "expense";

// --- 週別グラフ描画 ---
function drawWeeklyGraph(labels, weeklyData) {
    const ctx = document.getElementById("weeklyGraph").getContext("2d");

    // 既存のグラフがあれば破棄
    if (chartInstance) chartInstance.destroy();

    // --- 種別に応じてグラフタイプを変更 ---
    let chartType = "bar";  // デフォルト（支出）
    
    if (currentMode === "income") {
        chartType = "line";     // 収入 → 折れ線
    } else if (currentMode === "saving") {
        chartType = "line";     // 貯金 → 折れ線
    }

    chartInstance = new Chart(ctx, {
        type: chartType,
        data: {
            labels: labels,
            datasets: [{
                label: "週合計",
                data: weeklyData,
                backgroundColor: "rgba(54,162,235,0.7)"
            }]
        }
    });
}

// --- 月別グラフ描画（6か月表示） ---
function drawMonthlyGraph(labels, monthlyData) {
    const ctx = document.getElementById("weeklyGraph").getContext("2d");

    // 既存のグラフがあれば破棄
    if (chartInstance) chartInstance.destroy();

    let chartType = "line";  // 月別は折れ線グラフ
    let backgroundColor = "rgba(75,192,192,0.7)";
    let borderColor = "rgba(75,192,192,1)";

    if (currentMode === "saving") {
        backgroundColor = "rgba(255,159,64,0.7)";
        borderColor = "rgba(255,159,64,1)";
    }

    chartInstance = new Chart(ctx, {
        type: chartType,
        data: {
            labels: labels,
            datasets: [{
                label: "月合計",
                data: monthlyData,
                backgroundColor: backgroundColor,
                borderColor: borderColor,
                borderWidth: 2,
                fill: false
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

// --- モード切替 ---
document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
        currentMode = btn.dataset.mode;

        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        await reloadGraph();
    });
});

// 初期表示でAjaxを使って描画
document.addEventListener("DOMContentLoaded", () => {
    reloadGraph();
});

// 月選択フィールドの変更イベント
document.getElementById("monthSelect").addEventListener("change", () => {
    reloadGraph();
});


// --- Ajax 取得 ---
async function reloadGraph() {
    const month = document.getElementById("monthSelect").value;

    const res = await fetch(`/graphs/data?month=${month}&mode=${currentMode}`);
    const json = await res.json();

    // view_typeに応じてグラフを描画
    if (json.view_type === "monthly") {
        // 6か月表示（収入・貯金）
        drawMonthlyGraph(json.labels, json.data);
    } else {
        // 週別表示（支出）
        drawWeeklyGraph(json.labels, json.data);
    }
    
    document.getElementById("totalAmount").textContent = `￥${json.total}`;
}

</script>
{% endblock %}

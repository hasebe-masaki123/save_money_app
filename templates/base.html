<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}家計簿アプリ{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <!-- bootstrap4のCSSを追加 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% set hidden_routes = ['auth.login', 'auth.signup', 'auth.logout'] %}
    {% if request.endpoint not in hidden_routes %}
        {% include "bottom_nav.html" %}
    {% endif %}

    <script src="https://kit.fontawesome.com/ff96bd33d1.js" crossorigin="anonymous"></script>
</body>
</html>

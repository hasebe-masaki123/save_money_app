<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}家計簿アプリ{% endblock %}</title>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% set hidden_routes = ['auth.login', 'auth.signup', 'auth.logout'] %}

        {% include "bottom_nav.html" %}
    {% endif %}

    
</body>
</html>
